<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi New Biz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : barre de commande collée en haut, bandeau pipeline proportionnel, puis vue Tableau (esprit Excel) ou Pipeline (colonnes par étape). Fiche contact en tiroir à droite. */
:root{
  --bg:#F3F6F6; --surface:#FFFFFF; --sunk:#E9EFEE; --ink:#13201F; --muted:#5A6B69; --line:#D9E2E0;
  --accent:#0E6A64; --accent-ink:#FFFFFF; --accent-soft:#DDEEEB;
  --warn:#9A6212; --warn-soft:#F8EBD3; --crit:#B0352C; --crit-soft:#F7E1DE; --ok:#22744A; --ok-soft:#DCF0E3;
  --display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1514; --surface:#141F1E; --sunk:#1A2827; --ink:#E4EDEC; --muted:#93A6A3; --line:#273634;
  --accent:#4DB6AB; --accent-ink:#0B1716; --accent-soft:#17332F;
  --warn:#E2AA4E; --warn-soft:#3A2B12; --crit:#EC7A70; --crit-soft:#3C1D1A; --ok:#62C48F; --ok-soft:#163323; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1514; --surface:#141F1E; --sunk:#1A2827; --ink:#E4EDEC; --muted:#93A6A3; --line:#273634;
  --accent:#4DB6AB; --accent-ink:#0B1716; --accent-soft:#17332F;
  --warn:#E2AA4E; --warn-soft:#3A2B12; --crit:#EC7A70; --crit-soft:#3C1D1A; --ok:#62C48F; --ok-soft:#163323; color-scheme:dark}

*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Barre haute */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
.brand h1 b{color:var(--accent)}
.brand span{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tabs{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:var(--r);flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-weight:500;color:var(--muted);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}
.tabs .c{font-family:var(--mono);font-size:11px;margin-left:6px;opacity:.75}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--r);font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* Bandeau source des données */
.source{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:10px;font-size:13px;color:var(--muted)}
.tag{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:4px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.tag.live{background:var(--ok-soft);color:var(--ok)}

/* Synthèse */
.summary{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;padding-block:8px 16px}
@media (max-width:860px){.summary{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h2{font-family:var(--display);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}
.funnel{display:flex;height:34px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.funnel button{border:0;padding:0;min-width:4px;position:relative;transition:filter .15s}
.funnel button:hover{filter:brightness(1.08)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px 14px;margin-top:12px}
.legend button{border:0;background:none;padding:4px 0;display:flex;align-items:center;gap:8px;text-align:left;color:var(--ink);border-radius:4px}
.legend button[aria-pressed="true"]{text-decoration:underline;text-underline-offset:3px}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .n{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto}
.alerts{display:grid;gap:8px}
.alert{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface);text-align:left;width:100%}
.alert:hover{border-color:var(--accent)}
.alert .big{font-family:var(--display);font-size:26px;font-weight:700;min-width:44px}
.alert small{display:block;color:var(--muted);font-size:12px}
.alert.crit .big{color:var(--crit)} .alert.warn .big{color:var(--warn)} .alert.acc .big{color:var(--accent)}
.alert[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

/* Filtres */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-block:4px 12px}
.toolbar input[type=search]{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 12px}
.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;max-width:100%}
.views{margin-left:auto}

/* Tableau */
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:900px}
th{position:sticky;top:0;background:var(--sunk);text-align:left;font-family:var(--mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{border:0;background:none;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
th button[data-dir]::after{content:attr(data-dir);margin-left:4px;color:var(--accent)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
.co{font-weight:600}
.sub{color:var(--muted);font-size:12px;display:block}
.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:34ch;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;display:block}
.due{font-family:var(--mono);font-size:12px;padding:2px 6px;border-radius:4px;white-space:nowrap;display:inline-block;margin-top:3px}
.due.late{background:var(--crit-soft);color:var(--crit)}
.due.soon{background:var(--warn-soft);color:var(--warn)}
.due.ok{background:var(--sunk);color:var(--muted)}
.none{color:var(--crit);font-size:12px}
.resp{font-family:var(--mono);font-size:12px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* Pipeline */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;min-height:200px;display:flex;flex-direction:column;gap:8px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col h3{margin:0 0 4px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.col h3 .n{font-family:var(--mono);font-weight:400;color:var(--muted);margin-left:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;cursor:grab;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card .co{font-size:13px}
.more{font-size:12px;color:var(--muted);text-align:center;padding:4px}

/* Tiroir fiche */
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.28);z-index:40}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh h2{font-family:var(--display);font-size:20px;margin:0;line-height:1.2;text-wrap:balance}
.dh .x{margin-left:auto}
.db{padding:16px 18px;overflow-y:auto;display:grid;gap:14px;align-content:start}
.field{display:grid;gap:4px}
.field label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;width:100%}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.journal{display:grid;gap:0;border-left:2px solid var(--line);margin-left:4px}
.entry{position:relative;padding:2px 0 12px 14px}
.entry::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.entry time{font-family:var(--mono);font-size:12px;color:var(--muted)}
.entry p{margin:2px 0 0;white-space:pre-wrap}
.addentry{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:6px}
@media (max-width:440px){.addentry{grid-template-columns:minmax(0,1fr)}}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:var(--r);z-index:60;font-weight:500}
.note{font-size:12px;color:var(--muted);padding-block:18px 28px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-row">
    <div class="brand"><h1>Suivi <b>New Biz</b></h1><span>Suivi conquête 2026</span></div>
    <nav class="tabs" id="lists" aria-label="Listes"></nav>
    <div class="actions">
      <label class="btn primary" for="file">Importer l'Excel</label>
      <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
      <button class="btn" id="add">Nouveau contact</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="source" id="source"></div>

  <section class="summary">
    <div class="panel">
      <h2>Pipeline</h2>
      <div class="funnel" id="funnel" role="group" aria-label="Répartition par étape"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="panel">
      <h2>À traiter</h2>
      <div class="alerts" id="alerts"></div>
    </div>
  </section>

  <div class="toolbar">
    <input type="search" id="q" placeholder="Rechercher une entreprise, un contact, une note…">
    <select id="fSect" aria-label="Secteur"></select>
    <select id="fResp" aria-label="Responsable"></select>
    <div class="tabs views" role="group" aria-label="Vue">
      <button id="vTable" aria-pressed="true">Tableau</button>
      <button id="vBoard" aria-pressed="false">Pipeline</button>
    </div>
    <button class="btn ghost" id="copy">Copier en CSV</button>
    <button class="btn ghost" id="export" hidden>Exporter .xlsx</button>
  </div>

  <section id="tableView"></section>
  <section id="boardView" hidden></section>

  <p class="note">Les données importées sont lues et stockées uniquement dans ce navigateur : rien n'est envoyé sur un serveur. Le statut et les dates sont déduits automatiquement du texte de l'Excel au moment de l'import, puis modifiables contact par contact.</p>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="dTitle"></aside>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ---------- Référentiel ---------- */
const STAGES=[
 {k:'a_contacter',l:'À contacter',  mix:18, pipe:1},
 {k:'contacte',   l:'Contacté',     mix:38, pipe:1},
 {k:'echange',    l:'En échange',   mix:58, pipe:1},
 {k:'rdv',        l:'RDV',          mix:78, pipe:1},
 {k:'opportunite',l:'Opportunité',  mix:92, pipe:1},
 {k:'gagne',      l:'Gagné',        c:'var(--ok)', pipe:1},
 {k:'plus_tard',  l:'À reprendre plus tard', c:'var(--muted)'},
 {k:'adresse',    l:'Adresse à corriger',    c:'var(--warn)'},
 {k:'perdu',      l:'Sans suite',   c:'var(--crit)'}
];
const SK=Object.fromEntries(STAGES.map(s=>[s.k,s]));
const stColor=s=>s.c||`color-mix(in srgb, var(--accent) ${s.mix}%, var(--surface))`;
const stInk=s=>s.mix&&s.mix<60?'var(--ink)':(s.c?'var(--surface)':'var(--accent-ink)');
const MONTHS={janv:1,janvier:1,fev:2,'fév':2,fevrier:2,'février':2,mars:3,avril:4,avr:4,mai:5,juin:6,juillet:7,juil:7,aout:8,'août':8,sept:9,septembre:9,oct:10,octobre:10,nov:11,novembre:11,dec:12,'déc':12,decembre:12,'décembre':12,'rentrée':9,'rentree':9};
const TODAY=new Date(); TODAY.setHours(0,0,0,0);
const BASE_YEAR=2026;

/* ---------- Analyse du texte libre ---------- */
function iso(d){return d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:null}
function mk(y,m,d){const x=new Date(y,m-1,d);return x.getMonth()===m-1?x:null}
function datesIn(t){
  const out=[];const re=/(?<!\d)(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?(?!\d)/g;let m;
  while((m=re.exec(t||''))){const d=+m[1],mo=+m[2];if(d<1||d>31||mo<1||mo>12)continue;
    let y=m[3]?+m[3]:BASE_YEAR;if(y<100)y+=2000;const x=mk(y,mo,d);if(x)out.push(x)}
  return out;
}
function vagueDate(t){
  if(!t)return null;const s=t.toLowerCase();
  const y=(s.match(/20(2\d)/)||[])[0];const year=y?+y:BASE_YEAR;
  if(/(début|debut)\s+20\d\d/.test(s)&&!Object.keys(MONTHS).some(k=>s.includes(k)))return mk(year,1,10);
  if(/fin\s+(d'année\s+)?20\d\d/.test(s)&&!Object.keys(MONTHS).some(k=>s.includes(k+' ')))return mk(year,11,30);
  for(const [k,mo] of Object.entries(MONTHS)){
    const r=new RegExp(`(début|debut|mi|fin)?\\s*-?\\s*${k}\\b`);const m=s.match(r);
    if(m){const day=m[1]==='fin'?28:m[1]==='mi'?15:m[1]?5:15;return mk(year,mo,day)}
  }
  return null;
}
const DONE=/^\s*\d{1,2}[./]\d{1,2}[^:]*:\s*.*\b(ok|fait|pris|conv|rep|réponse|mail|invit|relance)/i;
function inferStage(all){
  const s=all.toLowerCase();
  if(!s.trim())return'a_contacter';
  if(/mauvaise adresse|trouver contact|bounce/.test(s))return'adresse';
  if(/pas de besoins?|pas intéress|n'organisons pas|ne pouvons que travailler|aucun investissement|pas une prio|ne me permet pas/.test(s))
    return /2027|recontact|plus tard|début 20|fin 20|rentrée/.test(s)?'plus_tard':'perdu';
  if(/\brdv\b|rendez-vous/.test(s)&&!/pas de (nouveaux )?(rdv|rendez)/.test(s))return'rdv';
  if(/pas de rep|pas rep|sans réponse/.test(s)&&!/\bconv\b|réponse :|réponse\s\d/.test(s))return'contacte';
  if(/\bconv\b|réponse|rép |rep :|linkedin|échange|appel|parle de nous|transmis/.test(s))return'echange';
  if(/mail|relanc|push|invit/.test(s))return'contacte';
  return'contacte';
}
function cell(v){if(v==null)return'';if(v instanceof Date)return`${String(v.getDate()).padStart(2,'0')}.${String(v.getMonth()+1).padStart(2,'0')}.${v.getFullYear()}`;return String(v).replace(/ /g,' ').trim()}
let uid=0;
function fromRaw(r,liste){
  const [ent,marque,sect,_st,resp,nom,fonction,src,dernier,prochaine,echeance,notes]=r.map(cell);
  if(!ent&&!nom)return null;
  const journal=[];
  const pushEntry=t=>{if(!t||t==='//')return;const ds=datesIn(t);journal.push({date:ds.length?iso(ds[0]):null,text:t})};
  dernier.split(/\n+/).map(x=>x.trim()).filter(Boolean).forEach(pushEntry);
  let next=prochaine, nextSrc=echeance;
  if(DONE.test(prochaine)){pushEntry(prochaine);next='';}
  if(DONE.test(echeance)){pushEntry(echeance);nextSrc='';}
  if(next==='//')next='';
  const all=[dernier,prochaine,echeance,notes].join(' | ');
  const stage=inferStage(all);
  let nd=datesIn(nextSrc)[0]||vagueDate(nextSrc)||datesIn(next)[0]||vagueDate(next);
  if(!next&&nextSrc&&!DONE.test(nextSrc))next=nextSrc;
  if(['perdu','gagne'].includes(stage)){next='';nd=null}
  journal.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const last=journal.filter(j=>j.date).map(j=>j.date).pop()||null;
  return {id:'c'+(++uid)+Date.now().toString(36),liste,entreprise:ent.toUpperCase()===ent?titleCase(ent):ent,marque,secteur:normSect(sect),
    resp:(resp||'—').replace(/\s+/g,' '),nom:nom.replace(/\s+/g,' '),fonction:fonction.replace(/\s+/g,' '),source:src,
    statut:stage,next,nextDate:iso(nd),journal,lastDate:last,notes};
}
function titleCase(s){return s.toLowerCase().replace(/(^|[\s'’-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()).replace(/\b(Sca|Scap)/g,m=>m.toUpperCase())}
function normSect(s){if(!s)return'Non renseigné';const t=s.trim();return t.length<5&&t===t.toUpperCase()?t:t.charAt(0).toUpperCase()+t.slice(1).toLowerCase()}

/* ---------- Données d'exemple (fictives) ---------- */
const DEMO={
 'TOP3':[
  ['COOP OUEST DISTRIB','Enseigne régionale','Retail','Contact établi','Alex','Julie Perrault','Responsable Marketing Communication','','mail push 08.06.26 (pas de rep)','mail opé tournée été','fin juin / début juillet',''],
  ['HYPERMARCHÉS DU SUD','','Retail','Contact établi','Alex','Nadia Ferreira','Responsable Communication & Activation MDD','','mail push 08.06.26','30.06 : conv RDV OK','',''],
  ['COOP RHÔNE-ALPES','Enseigne régionale','Retail','Contact établi','Alex','Thomas Girard','Responsable Marketing','','mail push 08.06.26','mail opé tournée été','fin 2027','Salon des producteurs tous les deux ans, recontacter fin 2027'],
  ['COOP NORMANDIE','Enseigne régionale','Retail','Contact établi','Alex','Claire Dumas','Responsable Communication','','mail push 08.06.26',"Pas de besoin à date, recontacter début 2027",'relancer début 2027',''],
  ['COOP EST','Enseigne régionale','Retail','Contact établi','Alex','Inès Delaunay','Responsable Communication & Marketing','','mail push 08.06.26','mail opé tournée été','fin juin / début juillet','RDV OK'],
  ['COOP ALSACE','Enseigne régionale','Retail','Contact établi','Alex','Marion Keller','Directrice Commerciale et Marketing','','mail push 08.06.26','','','mauvaise adresse, trouver contact'],
  ['STREAMBOX','','Pure player','Contact établi','Alex','Hugo Brisset','Sr. Manager, Marketing Production','','conv en mars, à voir dans l\'été','','RDV pris le 22.07','mettre en avant nos références culture'],

/* ---------- État ---------- */
const KEY='suivi-newbiz-v1';
let S={contacts:[],source:'demo',importedAt:null,file:null};
let UI={list:'all',stage:null,alert:null,q:'',sect:'',resp:'',view:'table',sort:{k:'nextDate',d:1},open:null};
function load(){
  try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&Array.isArray(o.contacts)&&o.contacts.length){S=o;return}}}catch(e){}
  S={contacts:demoContacts(),source:'demo',importedAt:null,file:null};
}
function demoContacts(){const out=[];for(const [l,rows] of Object.entries(DEMO))rows.forEach(r=>{const c=fromRaw(r,l);if(c)out.push(c)});
  // Démo : l'opportunité saisie à la main après import
  out.filter(c=>/Opportunité/.test(c.notes)).forEach(c=>c.statut='opportunite');return out}
function save(){if(S.source==='demo')return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- Calculs ---------- */
const days=d=>d?Math.round((new Date(d+'T00:00:00')-TODAY)/864e5):null;
const isOpen=c=>['a_contacter','contacte','echange','rdv','opportunite'].includes(c.statut);
const late=c=>isOpen(c)&&c.nextDate&&days(c.nextDate)<0;
const soon=c=>isOpen(c)&&c.nextDate&&days(c.nextDate)>=0&&days(c.nextDate)<=7;
const noNext=c=>['contacte','echange','rdv','opportunite'].includes(c.statut)&&!c.next&&!c.nextDate;
const ALERTS={
  late:{l:'relances en retard',s:'Date de prochaine action dépassée',cls:'crit',f:late},
  soon:{l:'à faire sous 7 jours',s:'Prochaines actions de la semaine',cls:'warn',f:soon},
  none:{l:'sans prochaine action',s:'Contacts actifs sans suite planifiée',cls:'acc',f:noNext},
  adresse:{l:'adresses à corriger',s:'Mails en erreur, contact à retrouver',cls:'warn',f:c=>c.statut==='adresse'}
};
function scoped(){return S.contacts.filter(c=>UI.list==='all'||c.liste===UI.list)}
function filtered(){
  const q=UI.q.trim().toLowerCase();
  return scoped().filter(c=>
    (!UI.stage||c.statut===UI.stage)&&(!UI.alert||ALERTS[UI.alert].f(c))&&(!UI.sect||c.secteur===UI.sect)&&(!UI.resp||c.resp===UI.resp)&&
    (!q||[c.entreprise,c.marque,c.nom,c.fonction,c.next,c.notes,c.source,...c.journal.map(j=>j.text)].join(' ').toLowerCase().includes(q)));
}

/* ---------- Rendu ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fd=d=>{if(!d)return'';const [y,m,dd]=d.split('-');return`${dd}.${m}.${y.slice(2)}`};
function pill(k){const s=SK[k];return`<span class="pill" style="background:color-mix(in srgb, ${stColor(s)} 22%, var(--surface));color:var(--ink)"><i style="background:${stColor(s)}"></i>${s.l}</span>`}
function dueChip(c){if(!c.nextDate)return'';const n=days(c.nextDate);const cls=!isOpen(c)?'ok':n<0?'late':n<=7?'soon':'ok';
  const lab=!isOpen(c)?fd(c.nextDate):n<0?`${fd(c.nextDate)} · ${-n} j de retard`:n===0?`aujourd'hui`:`${fd(c.nextDate)} · J-${n}`;return`<span class="due ${cls} num">${lab}</span>`}

function render(){
  const lists=['all',...new Set(S.contacts.map(c=>c.liste))];
  $('#lists').innerHTML=lists.map(l=>`<button data-l="${esc(l)}" aria-pressed="${UI.list===l}">${l==='all'?'Toutes':esc(l)}<span class="c num">${l==='all'?S.contacts.length:S.contacts.filter(c=>c.liste===l).length}</span></button>`).join('');
  $('#source').innerHTML=S.source==='demo'
    ?`<span class="tag">Exemple</span><span>Contacts et entreprises fictifs, au format du fichier de suivi. Importez l'Excel pour travailler sur les vraies données.</span>`
    :`<span class="tag live">Vos données</span><span>${esc(S.file||'Fichier importé')} · importé le ${new Date(S.importedAt).toLocaleDateString('fr-FR')} · ${S.contacts.length} contacts, ${new Set(S.contacts.map(c=>c.entreprise)).size} entreprises</span><button class="btn ghost" id="reset">Revenir à l'exemple</button>`;
  const sc=scoped();
  const counts=Object.fromEntries(STAGES.map(s=>[s.k,sc.filter(c=>c.statut===s.k).length]));
  $('#funnel').innerHTML=STAGES.filter(s=>counts[s.k]).map(s=>`<button style="flex:${counts[s.k]};background:${stColor(s)}" data-st="${s.k}" title="${s.l} : ${counts[s.k]}" aria-label="${s.l} : ${counts[s.k]}"></button>`).join('');
  $('#legend').innerHTML=STAGES.map(s=>`<button data-st="${s.k}" aria-pressed="${UI.stage===s.k}"><span class="sw" style="background:${stColor(s)}"></span>${s.l}<span class="n num">${counts[s.k]}</span></button>`).join('');
  $('#alerts').innerHTML=Object.entries(ALERTS).map(([k,a])=>`<button class="alert ${a.cls}" data-al="${k}" aria-pressed="${UI.alert===k}"><span class="big num">${sc.filter(a.f).length}</span><span><b>${a.l}</b><small>${a.s}</small></span></button>`).join('');
  const sects=[...new Set(sc.map(c=>c.secteur))].sort(), resps=[...new Set(sc.map(c=>c.resp))].sort();
  if(!sects.includes(UI.sect))UI.sect=''; if(!resps.includes(UI.resp))UI.resp='';
  $('#fSect').innerHTML=`<option value="">Tous secteurs</option>`+sects.map(s=>`<option ${s===UI.sect?'selected':''}>${esc(s)}</option>`).join('');
  $('#fResp').innerHTML=`<option value="">Tous responsables</option>`+resps.map(s=>`<option ${s===UI.resp?'selected':''}>${esc(s)}</option>`).join('');
  $('#vTable').setAttribute('aria-pressed',UI.view==='table');$('#vBoard').setAttribute('aria-pressed',UI.view==='board');
  $('#tableView').hidden=UI.view!=='table';$('#boardView').hidden=UI.view!=='board';
  UI.view==='table'?renderTable():renderBoard();
}
const ORDER=Object.fromEntries(STAGES.map((s,i)=>[s.k,i]));
function renderTable(){
  const rows=filtered();const {k,d}=UI.sort;
  rows.sort((a,b)=>{let x=a[k],y=b[k];if(k==='statut'){x=ORDER[x];y=ORDER[y]}
    if(x==null||x==='')return 1;if(y==null||y==='')return -1;return (x>y?1:x<y?-1:0)*d});
  const H=(key,l)=>`<th><button data-sort="${key}" ${UI.sort.k===key?`data-dir="${UI.sort.d>0?'↑':'↓'}"`:''}>${l}</button></th>`;
  $('#tableView').innerHTML=`<div class="tablebox"><table><thead><tr>${H('entreprise','Entreprise')}<th>Contact</th>${H('statut','Statut')}${H('lastDate','Dernier échange')}${H('nextDate','Prochaine action')}<th>Resp.</th></tr></thead><tbody>
  ${rows.map(c=>{const lj=c.journal[c.journal.length-1];return`<tr data-id="${c.id}" tabindex="0">
    <td><span class="co">${esc(c.entreprise)}</span>${c.marque?`<span class="sub">${esc(c.marque)}</span>`:''}<span class="sub">${esc(c.secteur)}${UI.list==='all'?' · '+esc(c.liste):''}</span></td>
    <td>${c.nom?esc(c.nom):'<span class="none">Contact à identifier</span>'}<span class="sub">${esc(c.fonction)}</span></td>
    <td>${pill(c.statut)}</td>
    <td>${c.lastDate?`<span class="num">${fd(c.lastDate)}</span>`:''}${lj?`<span class="clip">${esc(lj.text)}</span>`:'<span class="sub">Aucun échange</span>'}</td>
    <td>${c.next?`<span class="clip" style="color:var(--ink)">${esc(c.next)}</span>`:(noNext(c)?'<span class="none">À planifier</span>':'')}${dueChip(c)}</td>
    <td class="resp">${esc(c.resp)}</td></tr>`}).join('')}
  </tbody></table>${rows.length?'':'<div class="empty">Aucun contact ne correspond à ces filtres.</div>'}</div>`;
}
function renderBoard(){
  const rows=filtered();const LIM=40;
  $('#boardView').innerHTML=`<div class="board">${STAGES.filter(s=>!UI.stage||s.k===UI.stage).map(s=>{const cs=rows.filter(c=>c.statut===s.k).sort((a,b)=>(a.nextDate||'9').localeCompare(b.nextDate||'9'));
    return`<div class="col" data-drop="${s.k}"><h3><span class="sw" style="background:${stColor(s)}"></span>${s.l}<span class="n num">${cs.length}</span></h3>
    ${cs.slice(0,LIM).map(c=>`<button class="card" draggable="true" data-id="${c.id}"><span class="co">${esc(c.entreprise)}</span><span class="sub">${esc(c.nom||'Contact à identifier')}</span>${dueChip(c)}</button>`).join('')}
    ${cs.length>LIM?`<div class="more">+ ${cs.length-LIM} autres · affinez les filtres</div>`:''}</div>`}).join('')}</div>`;
}

/* ---------- Fiche contact ---------- */
function openDrawer(id){
  const c=S.contacts.find(x=>x.id===id);if(!c)return;UI.open=id;
  const d=$('#drawer');
  d.innerHTML=`<div class="dh"><div><span class="sub">${esc(c.liste)} · ${esc(c.secteur)}</span><h2 id="dTitle">${esc(c.entreprise)}</h2><span class="sub">${esc(c.nom||'Contact à identifier')}${c.fonction?' · '+esc(c.fonction):''}</span></div><button class="btn ghost x" data-close aria-label="Fermer">Fermer</button></div>
  <div class="db">
    <div class="row2"><div class="field"><label for="eSt">Statut</label><select id="eSt">${STAGES.map(s=>`<option value="${s.k}" ${s.k===c.statut?'selected':''}>${s.l}</option>`).join('')}</select></div>
    <div class="field"><label for="eResp">Responsable</label><input id="eResp" value="${esc(c.resp)}"></div></div>
    <div class="row2"><div class="field"><label for="eEnt">Entreprise</label><input id="eEnt" value="${esc(c.entreprise)}"></div>
    <div class="field"><label for="eMar">Marque</label><input id="eMar" value="${esc(c.marque)}"></div></div>
    <div class="row2"><div class="field"><label for="eNom">Contact</label><input id="eNom" value="${esc(c.nom)}"></div>
    <div class="field"><label for="eFon">Fonction</label><input id="eFon" value="${esc(c.fonction)}"></div></div>
    <div class="row2"><div class="field"><label for="eNext">Prochaine action</label><input id="eNext" value="${esc(c.next)}" placeholder="Ex. envoyer la reco"></div>
    <div class="field"><label for="eDate">Échéance</label><input type="date" id="eDate" value="${c.nextDate||''}"></div></div>
    <div class="field"><label for="eSrc">Source / intro</label><input id="eSrc" value="${esc(c.source)}"></div>
    <div class="field"><label for="eNotes">Notes</label><textarea id="eNotes" rows="3">${esc(c.notes)}</textarea></div>
    <div class="field"><label>Journal des échanges</label>
      <div class="journal">${c.journal.length?[...c.journal].reverse().map(j=>`<div class="entry"><time class="num">${j.date?fd(j.date):'Sans date'}</time><p>${esc(j.text)}</p></div>`).join(''):'<div class="entry"><p class="sub">Aucun échange enregistré.</p></div>'}</div>
      <div class="addentry"><input type="date" id="jDate" value="${iso(TODAY)}" aria-label="Date de l'échange"><input id="jText" placeholder="Ex. appel, RDV calé le 12.11"><button class="btn" id="jAdd">Ajouter</button></div>
    </div>
  </div>
  <div class="df"><button class="btn ghost" data-close>Annuler</button><button class="btn primary" id="eSave">Enregistrer</button></div>`;
  d.hidden=false;$('#scrim').hidden=false;$('#eSt').focus();
  $('#jAdd').onclick=()=>{const t=$('#jText').value.trim();if(!t)return;c.journal.push({date:$('#jDate').value||null,text:t});
    c.journal.sort((a,b)=>(a.date||'').localeCompare(b.date||''));c.lastDate=c.journal.filter(j=>j.date).map(j=>j.date).pop()||null;commit();openDrawer(id)};
  $('#eSave').onclick=()=>{Object.assign(c,{statut:$('#eSt').value,resp:$('#eResp').value.trim()||'—',entreprise:$('#eEnt').value.trim(),marque:$('#eMar').value.trim(),
    nom:$('#eNom').value.trim(),fonction:$('#eFon').value.trim(),next:$('#eNext').value.trim(),nextDate:$('#eDate').value||null,source:$('#eSrc').value.trim(),notes:$('#eNotes').value});
    commit();closeDrawer();toast('Contact enregistré')};
}
function closeDrawer(){$('#drawer').hidden=true;$('#scrim').hidden=true;UI.open=null}
function commit(){if(S.source==='demo'){S.source='demo-edit'}save();render()}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}

/* ---------- Import / export ---------- */
async function importFile(f){
  if(!window.XLSX){toast("La lecture d'Excel n'a pas pu se charger. Rechargez la page.");return}
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
    const out=[];
    for(const name of wb.SheetNames){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
      const hi=rows.findIndex(r=>r&&String(r[0]||'').trim().toLowerCase().replace(/^﻿/,'')==='entreprise');
      if(hi<0)continue;
      rows.slice(hi+1).forEach(r=>{const c=fromRaw(r.slice(0,12).concat(Array(12).fill(null)).slice(0,12),name.trim());if(c)out.push(c)});
    }
    if(!out.length){toast("Aucun onglet avec une colonne « Entreprise » en première colonne n'a été trouvé.");return}
    S={contacts:out,source:'file',importedAt:Date.now(),file:f.name};save();
    UI={...UI,list:'all',stage:null,alert:null,q:'',sect:'',resp:''};$('#q').value='';render();
    toast(`${out.length} contacts importés depuis ${wb.SheetNames.length} onglets`);
  }catch(e){toast("Ce fichier n'a pas pu être lu. Vérifiez qu'il s'agit bien d'un .xlsx ou d'un .csv.")}
}
const COLS=['Liste','Entreprise','Marque','Secteur','Statut','Responsable','Contact','Fonction','Source / intro','Dernier échange (date)','Journal','Prochaine action','Échéance','Notes'];
function rowsOut(){return filtered().map(c=>[c.liste,c.entreprise,c.marque,c.secteur,SK[c.statut].l,c.resp,c.nom,c.fonction,c.source,fd(c.lastDate),c.journal.map(j=>(j.date?fd(j.date)+' : ':'')+j.text).join(' / '),c.next,fd(c.nextDate),c.notes])}
function csv(){const q=v=>/[;"\n]/.test(v||'')?`"${String(v).replace(/"/g,'""')}"`:(v||'');return [COLS,...rowsOut()].map(r=>r.map(q).join(';')).join('\n')}

/* ---------- Événements ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-id],[data-close]');if(!t)return;
  if(t.dataset.l){UI.list=t.dataset.l;UI.stage=null;UI.alert=null;render();return}
  if(t.dataset.st){UI.stage=UI.stage===t.dataset.st?null:t.dataset.st;UI.alert=null;render();return}
  if(t.dataset.al){UI.alert=UI.alert===t.dataset.al?null:t.dataset.al;UI.stage=null;render();return}
  if(t.dataset.sort){const k=t.dataset.sort;UI.sort={k,d:UI.sort.k===k?-UI.sort.d:1};render();return}
  if(t.hasAttribute('data-close')){closeDrawer();return}
  if(t.dataset.id&&!t.closest('#drawer')){openDrawer(t.dataset.id);return}
  if(t.id==='reset'){try{localStorage.removeItem(KEY)}catch(_){ }S={contacts:demoContacts(),source:'demo',importedAt:null,file:null};render();toast("Données d'exemple rechargées")}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.open)closeDrawer();if(e.key==='Enter'&&e.target.matches('tr[data-id]'))openDrawer(e.target.dataset.id)});
$('#scrim').onclick=closeDrawer;
$('#q').oninput=e=>{UI.q=e.target.value;UI.view==='table'?renderTable():renderBoard()};
$('#fSect').onchange=e=>{UI.sect=e.target.value;render()};
$('#fResp').onchange=e=>{UI.resp=e.target.value;render()};
$('#vTable').onclick=()=>{UI.view='table';render()};
$('#vBoard').onclick=()=>{UI.view='board';render()};
$('#file').onchange=e=>{const f=e.target.files[0];if(f)importFile(f);e.target.value=''};
$('#add').onclick=()=>{const c={id:'c'+(++uid)+Date.now().toString(36),liste:UI.list==='all'?(S.contacts[0]?.liste||'TOP3'):UI.list,entreprise:'Nouvelle entreprise',marque:'',secteur:'Non renseigné',resp:UI.resp||'Alex',nom:'',fonction:'',source:'',statut:'a_contacter',next:'',nextDate:null,journal:[],lastDate:null,notes:''};
  S.contacts.unshift(c);commit();openDrawer(c.id)};
$('#copy').onclick=e=>{const t=csv();const ok=()=>toast(`${filtered().length} lignes copiées, à coller dans Excel`);
  try{navigator.clipboard.writeText(t).then(ok,()=>fallback(t))}catch(_){fallback(t)}};
function fallback(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Lignes copiées')}catch(_){toast('Copie refusée par le navigateur')}a.remove()}
// Export fichier : disponible quand l'outil est hébergé en propre (bloqué dans l'aperçu)
try{if(window.self===window.top)$('#export').hidden=false}catch(_){}
$('#export').onclick=()=>{if(!window.XLSX)return;const ws=XLSX.utils.aoa_to_sheet([COLS,...rowsOut()]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Suivi');XLSX.writeFile(wb,`SuiviNewBiz_${iso(TODAY)}.xlsx`)};
// Glisser-déposer dans la vue Pipeline
document.addEventListener('dragstart',e=>{const c=e.target.closest('.card');if(c)e.dataTransfer.setData('text/plain',c.dataset.id)});
document.addEventListener('dragover',e=>{const col=e.target.closest('[data-drop]');if(col){e.preventDefault();col.classList.add('over')}});
document.addEventListener('dragleave',e=>{const col=e.target.closest('[data-drop]');if(col)col.classList.remove('over')});
document.addEventListener('drop',e=>{const col=e.target.closest('[data-drop]');if(!col)return;e.preventDefault();
  const c=S.contacts.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(c&&c.statut!==col.dataset.drop){c.statut=col.dataset.drop;commit();toast(`${c.entreprise} → ${SK[c.statut].l}`)}});

load();render();
</script>
